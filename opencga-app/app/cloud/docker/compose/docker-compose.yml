name: opencga-local

services:
  # ─────────────────────────────────────────────────────────────────
  # MongoDB with replica set (required by OpenCGA catalog)
  # ─────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:${MONGO_VERSION}
    container_name: opencga-mongodb
    restart: unless-stopped
    mem_limit: ${OPENCGA_MONGO_MEM:-1g}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - opencga-mongodb:/data/db
    entrypoint:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
    healthcheck:
      test: >
        mongosh --quiet --eval "
          try {
            var status = rs.status();
            if (status.ok == 1) { quit(0); }
            else { quit(1); }
          } catch(e) {
            quit(1);
          }
        "
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # Initialize MongoDB replica set
  mongodb-init:
    image: mongo:${MONGO_VERSION}
    container_name: opencga-mongodb-init
    depends_on:
      mongodb:
        condition: service_started
    restart: "no"
    entrypoint:
      - bash
      - -c
      - |
        echo "Waiting for MongoDB to start..."
        sleep 5
        echo "Initializing replica set..."
        mongosh --host mongodb:27017 --eval '
          try {
            rs.status();
            print("Replica set already initialized");
          } catch(e) {
            rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongodb:27017" }] });
            print("Replica set initiated");
          }
        '
        echo "Waiting for replica set to stabilize..."
        sleep 5
        mongosh --host mongodb:27017 --eval 'rs.status().ok' | grep 1
        echo "MongoDB replica set ready."

  # ─────────────────────────────────────────────────────────────────
  # Solr (search engine for variant/clinical/rga indexes)
  # ─────────────────────────────────────────────────────────────────
  solr:
    image: solr:${SOLR_VERSION}
    container_name: opencga-solr
    restart: unless-stopped
    mem_limit: ${OPENCGA_SOLR_MEM:-1g}
    ports:
      - "${SOLR_PORT}:8983"
    volumes:
      - opencga-solr:/var/solr/data
    command: ["solr-foreground", "-c", "-Dsolr.jetty.request.header.size=65535"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8983/solr/admin/info/system"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  # Copy Solr configsets from opencga-base into shared volume
  solr-configsets-copy:
    image: ${OPENCGA_IMAGE}
    container_name: opencga-solr-configsets-copy
    user: "0:0"
    volumes:
      - opencga-solr-configsets:/configsets
    restart: "no"
    entrypoint:
      - bash
      - -c
      - |
        cp -r /opt/opencga/misc/solr/* /configsets/

  # Upload Solr configsets via install.sh (needs solr binary + ZK access)
  solr-init:
    image: solr:${SOLR_VERSION}
    container_name: opencga-solr-init
    depends_on:
      solr:
        condition: service_healthy
      solr-configsets-copy:
        condition: service_completed_successfully
    volumes:
      - opencga-solr-configsets:/configsets
    restart: "no"
    entrypoint:
      - bash
      - -c
      - |
        set -e
        # install.sh expects OPENCGA_HOME/misc/solr layout
        rm -rf /tmp/opencga/misc/solr
        mkdir -p /tmp/opencga/misc
        ln -s /configsets /tmp/opencga/misc/solr
        bash /configsets/install.sh solr:9983 /opt/solr /tmp/opencga

  # ─────────────────────────────────────────────────────────────────
  # OpenCGA init: install catalog database
  # ─────────────────────────────────────────────────────────────────
  opencga-init:
    image: ${OPENCGA_IMAGE}
    container_name: opencga-init
    depends_on:
      mongodb:
        condition: service_healthy
      solr-init:
        condition: service_completed_successfully
    volumes:
      - ${OPENCGA_LOCAL_HOME}/conf:/opt/opencga/conf
      - ${OPENCGA_LOCAL_SCRIPTS}:/opt/opencga/scripts:ro
      - ${OPENCGA_LOCAL_HOME}/data/sessions:/opt/opencga/sessions
      - ${OPENCGA_LOCAL_HOME}/data/logs:/opt/opencga/logs
    environment:
      - OPENCGA_ADMIN_PASSWORD=${OPENCGA_ADMIN_PASSWORD}
    entrypoint: ["bash", "/opt/opencga/scripts/opencga-install.sh"]

  # ─────────────────────────────────────────────────────────────────
  # OpenCGA REST server
  # ─────────────────────────────────────────────────────────────────
  opencga-rest:
    image: ${OPENCGA_IMAGE}
    container_name: opencga-rest
    hostname: rest
    restart: unless-stopped
    mem_limit: ${OPENCGA_REST_MEM:-650m}
    depends_on:
      opencga-init:
        condition: service_completed_successfully
    ports:
      - "${OPENCGA_REST_PORT}:9090"
    volumes:
      - ${OPENCGA_LOCAL_HOME}/conf:/opt/opencga/conf
      - ${OPENCGA_LOCAL_HOME}/data/sessions:/opt/opencga/sessions
      - ${OPENCGA_LOCAL_HOME}/data/logs:/opt/opencga/logs
      - ${DOCKER_SOCK}:/var/run/docker.sock
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - JAVA_OPTS=${OPENCGA_REST_JAVA_OPTS:-}
    entrypoint:
      - bash
      - -c
      - |
        # Rename WAR so Jetty deploys at /opencga context path
        if ls /opt/opencga/opencga-*.war 1>/dev/null 2>&1; then
          mv /opt/opencga/opencga-*.war /opt/opencga/opencga.war
        fi
        echo "Starting OpenCGA REST server on port 9090..."
        /opt/opencga/bin/opencga-admin.sh server rest --start --port 9090
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/opencga/webservices/rest/v3/meta/status"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ─────────────────────────────────────────────────────────────────
  # OpenCGA Master (daemon for job execution, monitor, etc.)
  # ─────────────────────────────────────────────────────────────────
  opencga-master:
    image: ${OPENCGA_IMAGE}
    container_name: opencga-master
    hostname: master
    restart: unless-stopped
    mem_limit: ${OPENCGA_MASTER_MEM:-2253m}
    depends_on:
      opencga-setup:
        condition: service_completed_successfully
    volumes:
      - ${OPENCGA_LOCAL_HOME}/conf:/opt/opencga/conf
      - ${OPENCGA_LOCAL_HOME}/data/sessions:/opt/opencga/sessions
      - ${OPENCGA_LOCAL_HOME}/data/logs:/opt/opencga/logs
      - ${DOCKER_SOCK}:/var/run/docker.sock
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - OPENCGA_ADMIN_PASSWORD=${OPENCGA_ADMIN_PASSWORD}
      - JAVA_OPTS=${OPENCGA_MASTER_JAVA_OPTS:-}
    entrypoint:
      - bash
      - -c
      - |
        echo "Starting OpenCGA Master (daemon)..."
        echo "$${OPENCGA_ADMIN_PASSWORD}" | /opt/opencga/bin/opencga-admin.sh catalog daemon --start

  # ─────────────────────────────────────────────────────────────────
  # Create organization + owner user (requires REST API)
  # ─────────────────────────────────────────────────────────────────
  opencga-setup:
    image: ${OPENCGA_IMAGE}
    container_name: opencga-setup
    depends_on:
      opencga-rest:
        condition: service_healthy
    volumes:
      - ${OPENCGA_LOCAL_HOME}/conf:/opt/opencga/conf
      - ${OPENCGA_LOCAL_SCRIPTS}:/opt/opencga/scripts:ro
    restart: "no"
    entrypoint: ["bash", "/opt/opencga/scripts/opencga-setup.sh"]
    environment:
      - OPENCGA_ADMIN_PASSWORD=${OPENCGA_ADMIN_PASSWORD}
      - OPENCGA_ORG_ID=${OPENCGA_ORG_ID}
      - OPENCGA_OWNER_ID=${OPENCGA_OWNER_ID}
      - OPENCGA_OWNER_NAME=${OPENCGA_OWNER_NAME}
      - OPENCGA_OWNER_EMAIL=${OPENCGA_OWNER_EMAIL}
      - OPENCGA_OWNER_PASSWORD=${OPENCGA_OWNER_PASSWORD}

  # ─────────────────────────────────────────────────────────────────
  # IVA Web Application
  # ─────────────────────────────────────────────────────────────────
  iva:
    image: ${IVA_DOCKER_IMAGE}:${IVA_VERSION}
    container_name: opencga-iva
    restart: unless-stopped
    mem_limit: 20m
    depends_on:
      opencga-rest:
        condition: service_healthy
    ports:
      - "${IVA_PORT}:8080"
    volumes:
      - ${OPENCGA_LOCAL_HOME}/iva/server.json:/usr/local/apache2/htdocs/iva/conf/server.json:ro

volumes:
  opencga-mongodb:
  opencga-solr:
  opencga-solr-configsets:
