name: Build and Test opencga-r-builder Docker Image

on:
  workflow_call:
    inputs:
      branch:
        description: "The branch, tag or SHA of the source code to build client."
        type: string
        required: true

jobs:
  build-test-publish:
    runs-on: ${{ vars.UBUNTU_VERSION }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '10'
          ref: ${{ inputs.branch }}
      - id: get_opencga_branch
        name: Get OpenCGA branch from pom.xml property
        run: |
          chmod +x ./.github/workflows/scripts/opencga_branch.sh
          # Determine flag is_release on the provided branch
          if [[ "${{ inputs.branch }}" == v* ]]; then
            is_release="true"
          else
            is_release="false"
          fi
          opencga_branch=$(./.github/workflows/scripts/opencga_branch.sh "$is_release" )
          echo "OpenCGA ref: __\"${opencga_branch}\"__" | tee -a ${GITHUB_STEP_SUMMARY}
          echo "Is release: __\"${{ inputs.release }}\"__" | tee -a ${GITHUB_STEP_SUMMARY}
          echo "opencga_branch=${opencga_branch}" >> $GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          repository: zetta-genomics/opencga
          ref: ${{ steps.get_opencga_branch.outputs.opencga_branch }}
          path: opencga-home
          fetch-depth: '10'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        run: |
          ./client-builder.sh --skip-python --skip-javascript
      - name: Extract version from DESCRIPTION
        id: version
        run: |
          VERSION=$(grep '^Version:' build/clients/R/DESCRIPTION | cut -d' ' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Upload built R package as artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencgaEnterpriseR_${{ steps.version.outputs.version }}.tar.gz
          path: build/dist/opencgaEnterpriseR_${{ steps.version.outputs.version }}.tar.gz
