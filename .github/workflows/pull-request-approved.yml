name: Pull request approve workflow
run-name: 'Pull request approve workflow ${{ github.event.pull_request.head.ref }} -> ${{ github.event.pull_request.base.ref }} by @${{ github.actor }}'

on:
  pull_request_review:
    types: [submitted]

jobs:
  test:
    if: github.event.review.state == 'approved'
    name: "Run all tests before merging"
    runs-on: ${{ vars.UBUNTU_VERSION }}
    steps:
      - name: Retrieve secrets from Keeper
        id: ksecrets
        uses: Keeper-Security/ksm-action@master
        with:
          keeper-secret-config: ${{ secrets.KEEPER_SM_GH_ZETTAGENOMICS }}
          secrets: |
            AZURE_KUBE_CONFIG/field/Secret Value > env:AZURE_KUBE_CONFIG
            DOCKER_HUB_USER/field/Secret Value > env:DOCKER_HUB_USER
            DOCKER_HUB_PASSWORD/field/Secret Value > env:DOCKER_HUB_PASSWORD
            SSH_TESTING_SERVER_HOST/field/Secret Value > env:SSH_HOST
            SSH_TESTING_SERVER_PORT/field/Secret Value > env:SSH_PORT
            SSH_TESTING_SERVER_USER/field/Secret Value > env:SSH_USER
            SSH_TESTING_SERVER_PASSWORD/field/Secret Value > env:SSH_PASS
      - name: Clone OpenCGA Enterprise branch '${{ github.event.pull_request.head.ref }}'
        uses: actions/checkout@v4
        with:
          repository: zetta-genomics/opencga-enterprise
          token: ${{ secrets.GH_PRIVATE_TOKEN }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: "0" # Perform a full clone, not a shallow one to build.sh can get the branch name
      - id: get_opencga_branch
        name: Get current branch for opencga from 'pom.xml' property
        run: |
          pwd
          chmod +x ./.github/workflows/scripts/get-opencga-xetabase-branch.sh
          opencga_branch=$(./.github/workflows/scripts/get-opencga-xetabase-branch.sh  ${{ github.event.pull_request.head.ref }})
          echo "__OpenCGA ref:__ \"${opencga_branch}\"" | tee -a ${GITHUB_STEP_SUMMARY}
          echo "opencga_branch=${opencga_branch}" >> $GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          repository: opencb/opencga
          ref: ${{ steps.get_opencga_branch.outputs.opencga_branch }}
          path: opencga-home
          fetch-depth: "0" # Perform a full clone, not a shallow one to build.sh can get the branch name
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'maven'
      - name: Clone dependencies
        id: clone_dependencies
        run: |
          if [ -f "./.github/workflows/scripts/get_same_branch.sh" ]; then
            chmod +x ./.github/workflows/scripts/get_same_branch.sh
            export DEPENDENCIES_SHA=${{ github.sha }}
            ./.github/workflows/scripts/get_same_branch.sh ${{ github.event.pull_request.head.ref }})
          fi
      - name: Cache local Maven repository
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ vars.HADOOP_FLAVOUR }}-${{ steps.clone_dependencies.outputs.dependencies_sha }}
          restore-keys: |
            ${{ runner.os }}-maven-${{ vars.HADOOP_FLAVOUR }}-
      - name: Compile dependencies
        run: |
          if [ -f "./.github/workflows/scripts/compile_same_branch.sh" ]; then
            chmod +x ./.github/workflows/scripts/compile_same_branch.sh
            ./.github/workflows/scripts/compile_same_branch.sh
          fi
      - name: Install Samtools
        run: sudo apt-get install samtools python3-deeptools
      - name: Start MongoDB v6.0
        uses: supercharge/mongodb-github-action@1.8.0
        with:
          mongodb-version: 6.0
          mongodb-replica-set: rs-test
      - name: DockerHub login
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_HUB_USER }}
          password: ${{ env.DOCKER_HUB_PASSWORD }}
      - name: Install sshpass
        run: sudo apt-get install sshpass
      - name: Prepare SSH and scan host
        continue-on-error: true
        run: |
          set +e  # temporarily disable exit-on-error to capture failures without aborting

          echo "Creating ~/.ssh directory and setting permissions"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "Scanning SSH host $SSH_HOST on port $SSH_PORT"
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>&1
          scan_status=$?
          if [ $scan_status -ne 0 ]; then
            echo "ssh-keyscan exited with status $scan_status"
          fi

          echo "Setting permissions on known_hosts"
          chmod 644 ~/.ssh/known_hosts

          echo " Showing contents of ~/.ssh/known_hosts:"
          cat ~/.ssh/known_hosts || echo "(known_hosts is empty or unreadable)"

          set -e  # re-enable exit-on-error for subsequent steps

          echo "SSH keyscan step completed (errors ignored here)"
        #
        #      - name: Add SSH Host to known_hosts
        #        run: |
        #          mkdir -p ~/.ssh
        #          ssh-keyscan -p ${{ env.SSH_PORT }} ${{ env.SSH_HOST }} >> ~/.ssh/known_hosts
        env:
          SSH_HOST: ${{ env.SSH_HOST }}
          SSH_PORT: ${{ env.SSH_PORT }}
      - name: Run all OpenCB Junit tests, ie. java-common-libs, biodata, opencga and opencga-enterprise
        run: |
          ./build.sh --test --test-level runShortTests --prepare-branches --prepare-hadoop --test-save-reports --task ${{ github.event.pull_request.head.ref }} --storage-hadoop ${{ vars.HADOOP_FLAVOUR }}
        env:
          THIRDPARTY_READ_TOKEN: ${{ secrets.THIRDPARTY_READ_TOKEN }}
      - name: Upload reports results to Github
        uses: actions/upload-artifact@v4
        with:
          name: report-test
          path: ./reports/
          if-no-files-found: error
      - name: Upload log
        uses: actions/upload-artifact@v4
        ## Skip cancelled()
        ## https://docs.github.com/en/actions/learn-github-actions/expressions#cancelled
        if: success() || failure()
        with:
          name: build-log
          path: |
            ./build.log
            ./reports/*.log.gz
          if-no-files-found: error
