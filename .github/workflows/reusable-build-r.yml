name: Build and Test opencga-r-builder Docker Image

on:
  workflow_call:
    secrets:
      DOCKER_HUB_USER:
        required: true
      DOCKER_HUB_PASSWORD:
        required: true

jobs:
  build:
    uses: ./.github/workflows/build-java-enterprise-workflow.yml
    with:
      storage_hadoop: hdp3.1
      artifact_name: build-folder

  build-test-publish:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '10'
      - id: get_opencga_branch
        name: Get OpenCGA branch from pom.xml property
        run: |
          chmod +x ./.github/workflows/scripts/opencga_branch.sh
          opencga_branch=$(./.github/workflows/scripts/opencga_branch.sh "${{ inputs.release }}" )
          echo "OpenCGA ref: __\"${opencga_branch}\"__" | tee -a ${GITHUB_STEP_SUMMARY}
          echo "Is release: __\"${{ inputs.release }}\"__" | tee -a ${GITHUB_STEP_SUMMARY}
          echo "opencga_branch=${opencga_branch}" >> $GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          repository: opencb/opencga
          ref: ${{ steps.get_opencga_branch.outputs.opencga_branch }}
          path: opencga-home
          fetch-depth: '10'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - uses: actions/download-artifact@v4
        with:
          name: build-folder
          path: build

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t opencb/opencga-r-builder:dev \
            -f opencga-home/opencga-app/app/cloud/docker/opencga-r-builder/Dockerfile \
            opencga-home/opencga-app/app/cloud/docker/opencga-r-builder

      - name: Test R CMD build inside container
        run: |
          docker run --rm \
            --mount type=bind,source="${{ github.workspace }}/build/clients/R",target=/opt/opencga/R \
            --mount type=bind,source="${{ github.workspace }}/build",target=/opt/opencga \
            opencb/opencga-r-builder:dev \
            R CMD build /opt/opencga/R

      - name: Extract version from DESCRIPTION
        id: version
        run: |
          VERSION=$(grep '^Version:' build/clients/R/DESCRIPTION | cut -d' ' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload built R package as artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencga_enterprise_R_client${{ steps.version.outputs.version }}.tar.gz
          path: build/opencga_enterprise_R_client${{ steps.version.outputs.version }}.tar.gz