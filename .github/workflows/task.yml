name: Push OpenCGA TASK

on:
  push:
    branches:
      - TASK-*
  workflow_dispatch:

jobs:
  build-opencga:
    name: Build OpenCGA app
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
        with:
          repository: opencb/opencga
          ref: develop
          fetch-depth: '10'
      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'maven'
      - name: Maven Build (skip tests)
        run: mvn -T 2 clean install -DskipTests
#      - name: Set up JDK 8
#        uses: actions/setup-java@v3
#        with:
#          distribution: 'temurin'
#          java-version: '8'
#          cache: 'maven'
#          ## Future Nacho and Juanfe, please read this very carefully: DO NOT TOUCH!!!
#          server-id: ossrh                                        # Value of the distributionManagement/repository/id field of the pom.xml
#          server-username: MAVEN_NEXUS_USER                       # env variable for username in deploy
#          server-password: MAVEN_NEXUS_PASSWORD                   # env variable for token in deploy
#          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}   # Value of the GPG private key to import
#          gpg-passphrase: MAVEN_GPG_PASSPHRASE                    # env variable for GPG private key passphrase
#      - name: Deploy to Maven Central repository
#        run: mvn clean deploy -DskipTests -P deploy ${{ inputs.maven_opts }}
#        env:
#          MAVEN_NEXUS_USER: ${{ secrets.MAVEN_NEXUS_USER }}
#          MAVEN_NEXUS_PASSWORD: ${{ secrets.MAVEN_NEXUS_PASSWORD }}
#          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - uses: actions/upload-artifact@v3
        with:
          name: opencga-build-folder
          path: build

  build:
    name: Build OpenCGA Enterprise app
    runs-on: ubuntu-22.04
    needs: build-opencga
    outputs:
      version: ${{ steps.get_project_version.outputs.version }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: '10'
      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'maven'
      - name: Download OpenCGA
        uses: actions/download-artifact@v3
        with:
          name: opencga-build-folder
          path: opencga-home
      - name: Maven Build (skip tests)
        run: mvn -T 2 clean install -DskipTests
      - uses: actions/upload-artifact@v3
        with:
          name: build-folder
          path: build
      - id: get_project_version
        uses: avides/actions-project-version-check@v1.3.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          file-to-check: pom.xml
          only-return-version: true
      - name: test-version-from-check
        run: echo "Project version is " ${{ steps.get_project_version.outputs.version }}

#  test:
#    uses: zettagenomics/opencga-enterprise/.github/workflows/build-analysis.yml@develop
#    needs: build
#    secrets: inherit

  deploy-docker:
    uses: opencb/java-common-libs/.github/workflows/deploy-docker-hub-workflow.yml@develop
    needs: build
    with:
      cli: python3 ./build/cloud/docker/docker-build.py push --images base,init
    secrets: inherit
