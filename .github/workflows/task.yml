name: Push OpenCGA TASK

on:
  push:
    branches:
      - TASK-*
  workflow_dispatch:
    inputs:
      branch:
        description: 'Execute workflow'
        default: 'develop'
        required: true

jobs:
  build:
    uses: ./.github/workflows/build-java-enterprise-workflow.yml
    with:
      storage_hadoop: ${{ vars.HADOOP_FLAVOUR }}
      artifact_name: build-folder
      python_client: true

  deploy-docker-hub:
    name: Push Docker image
    runs-on: ${{ vars.UBUNTU_VERSION }}
    needs: build
    steps:
      - name: Download build dir
        uses: actions/download-artifact@v4
        with:
          name: build-folder
          path: build
      - name: Chmod
        run: "find build -regex '.*sh' | while read file ; do chmod u+x $file ; done"
      - name: Docker Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      - name: Push in Docker Hub
        run: python3 ./build/cloud/docker/docker-build.py push --org zettagenomics --images enterprise --tag ${{ github.ref_name }}

  deploy-python:
    uses: opencb/java-common-libs/.github/workflows/deploy-python-workflow.yml@develop
    needs: build
    with:
      cli: ./clients/python/python-build.sh push
      artifact: build-folder
    secrets:
      PYPI_TWINE_USER: ${{ secrets.PYPI_TWINE_USER }}
      PYPI_TWINE_PASSWORD: ${{ secrets.PYPI_TWINE_PASSWORD }}