name: Manual Deploy Docker OpenCGA Enterprise

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "The branch, tag or SHA of the source code to build docker."
        type: string
        required: true
      task:
        description: "The task to be built (e.g., 'TASK-1234'). Only necessary if not exists branch for enterprise in this task"
        type: string
        required: false
      tag:
        description: "The tag for the new docker."
        type: string
        required: false
      hadoop:
        type: choice
        description: 'Hadoop flavour. Any of: [hdp3.1, hdi5.1, emr6.1, emr6.13]'
        required: false
        default: hdp3.1
        options:
          - hdp3.1
          - hdi5.1
          - emr6.1
          - emr6.13
      release:
        type: boolean
        required: false
        default: ""


jobs:
  build:
    name: Build OpenCGA Enterprise app
    runs-on: ${{ vars.UBUNTU_VERSION }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '10'
          ref: "${{ inputs.branch }}"
      - id: get_opencga_branch
        name: Get OpenCGA branch from pom.xml property
        run: |
          chmod +x ./.github/workflows/scripts/opencga_branch.sh
          opencga_branch=$(./.github/workflows/scripts/opencga_branch.sh "${{ inputs.release }}" )
          echo "OpenCGA ref: __\"${opencga_branch}\"__" | tee -a ${GITHUB_STEP_SUMMARY}
          echo "Is release: __\"${{ inputs.release }}\"__" | tee -a ${GITHUB_STEP_SUMMARY}
          echo "opencga_branch=${opencga_branch}" >> $GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          repository: opencb/opencga
          ref: ${{ steps.get_opencga_branch.outputs.opencga_branch }}
          path: opencga-home
          fetch-depth: '10'
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'maven'
      - name: Install dependencies branches
        run: |
          if [ -f "./.github/workflows/scripts/get_same_branch.sh" ]; then
            chmod +x ./.github/workflows/scripts/get_same_branch.sh
            ./.github/workflows/scripts/get_same_branch.sh ${{ steps.get_opencga_branch.outputs.opencga_branch }}
          fi
      - name: OpenCGA Enterprise Maven Build (skip tests)
        run: |
          branch_name=$(git rev-parse --abbrev-ref HEAD)
          if [ -n "${{ inputs.task }}" ]; then
              branch_name="${{ inputs.task }}"           
          fi
          ./build.sh --storage-hadoop ${{ inputs.storage_hadoop }} -b -T "$branch_name"
      - uses: actions/upload-artifact@v4
        with:
          name: build-folder
          path: build

  deploy-emr13-docker:
    uses: ./.github/workflows/deploy-docker-hub-enterprise-workflow.yml
    needs:  build
    secrets: inherit
    with:
      artifact_name: build-folder