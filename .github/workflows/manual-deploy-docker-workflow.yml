name: Manual Deploy Docker OpenCGA Enterprise
run-name: "Manual deploy the enterprise branch ${{ inputs.branch }} ${{ inputs.task == inputs.branch && '' || inputs.task }} with tag ${{ inputs.tag }} to Zettagenomics docker hub Central"

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "The branch, tag or SHA of the source code to build docker."
        type: string
        required: true
      task:
        description: "The task to be built (e.g., 'TASK-1234'). Only necessary if not exists branch for enterprise in this task"
        type: string
        required: false
      tag:
        description: "The tag for the new docker."
        type: string
        required: false
      release:
        description: "If true, it will download a released version of opencga otherwise a snapshot version."
        type: boolean
        required: false
        default: false
      hadoop:
        type: choice
        description: 'Hadoop flavour. Any of: [hdp3.1, hdi5.1, emr6.1, emr6.13]'
        required: false
        default: hdp3.1
        options:
          - hdp3.1
          - hdi5.1
          - emr6.1
          - emr6.13

jobs:
  build:
    name: Build OpenCGA Enterprise app
    runs-on: ${{ vars.UBUNTU_VERSION }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '10'
          ref: "${{ inputs.branch }}"
      - id: get_opencga_branch
        name: If not exists TASK branch get OpenCGA branch from pom.xml property
        run: |
          task_name="${{ inputs.task }}"
          # Check 1) non-empty, 2) starts with TASK-, 3) remote branch exists
          if [[ -n "$task_name" && "$task_name" == TASK-* ]]; then
              # Use ls-remote with --exit-code so it fails when no match
              if git ls-remote --exit-code --heads https://github.com/opencb/opencga.git "$task_name" >/dev/null 2>&1; then
                echo "Branch '$task_name' will be used to build OpenCGA Enterprise." | tee -a "${GITHUB_STEP_SUMMARY}"
                echo "Branch '$task_name' will be used to build OpenCGA Enterprise."
                echo "opencga_branch=$task_name" >> "$GITHUB_OUTPUT"
              else
                echo "Warning: Remote branch '$task_name' not found. Reading version from pom." | tee -a "${GITHUB_STEP_SUMMARY}"
                echo "Warning: Remote branch '$task_name' not found. Reading version from pom."
                chmod +x ./.github/workflows/scripts/opencga_branch.sh
                opencga_branch=$(./.github/workflows/scripts/opencga_branch.sh ${{ inputs.release && true || false }})
                echo "opencga_branch=${opencga_branch}" >> "$GITHUB_OUTPUT"
              fi
            else
              echo "Warning: 'task_name' is empty or does not start with 'TASK-'. Reading version from pom." | tee -a "${GITHUB_STEP_SUMMARY}"
              echo "Warning: 'task_name' is empty or does not start with 'TASK-'. Reading version from pom."
              chmod +x ./.github/workflows/scripts/opencga_branch.sh
              opencga_branch=$(./.github/workflows/scripts/opencga_branch.sh ${{ inputs.release && true || false }})
              echo "opencga_branch=${opencga_branch}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          repository: opencb/opencga
          ref: ${{ steps.get_opencga_branch.outputs.opencga_branch }}
          path: opencga-home
          fetch-depth: '10'
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'maven'
      - name: Docker Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      - name: OpenCGA Enterprise Maven Build (skip tests)
        run: |
          if [ -n "${{ inputs.task }}" ]; then
              ./build.sh -b -T "${{ inputs.task }}" --storage-hadoop ${{ inputs.hadoop }} -d -p "${{ inputs.task }}"
          else
              ./build.sh -b --storage-hadoop ${{ inputs.hadoop }} -d 
          fi
