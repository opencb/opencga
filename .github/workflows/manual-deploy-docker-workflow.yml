name: Manual Deploy Docker OpenCGA Enterprise

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "The branch, tag or SHA of the source code to build docker."
        type: string
        required: true
      task:
        description: "The task to be built (e.g., 'TASK-1234'). Only necessary if not exists branch for enterprise in this task"
        type: string
        required: false
      tag:
        description: "The tag for the new docker."
        type: string
        required: false
      hadoop:
        type: choice
        description: 'Hadoop flavour. Any of: [hdp3.1, hdi5.1, emr6.1, emr6.13]'
        required: false
        default: hdp3.1
        options:
          - hdp3.1
          - hdi5.1
          - emr6.1
          - emr6.13

jobs:
  build:
    name: Build OpenCGA Enterprise app
    runs-on: ${{ vars.UBUNTU_VERSION }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '10'
          ref: "${{ inputs.branch }}"
      - id: get_opencga_branch
        name: Get OpenCGA branch from pom.xml property
        run: |
          task_name="${{ inputs.task }}"
          # If task_name is provided and starts with "TASK-"
          if [[ -n "$task_name" && "$task_name" == TASK-* ]]; then
          # Check if the branch exists in the remote repository
            if git ls-remote --heads https://github.com/opencb/opencga.git "refs/heads/$task_name" | grep -q "$task_name"; then
              echo " Branch '$task_name' will be use to build OpenCGA Enterprise." | tee -a ${GITHUB_STEP_SUMMARY}
              echo "Branch '$task_name' will be use to build OpenCGA Enterprise."
              echo "opencga_branch=$task_name" >> $GITHUB_OUTPUT
            else
              echo "Warning: Branch '$task_name' does not exist in the remote repository." | tee -a ${GITHUB_STEP_SUMMARY}
              echo "Warning: Branch '$task_name' does not exist in the remote repository."
              chmod +x ./.github/workflows/scripts/opencga_branch.sh
              opencga_branch=$(./.github/workflows/scripts/opencga_branch.sh "${{ inputs.release }}" )
              echo "opencga_branch=${opencga_branch}" >> $GITHUB_OUTPUT
            fi
          fi
      - uses: actions/checkout@v4
        with:
          repository: opencb/opencga
          ref: ${{ steps.get_opencga_branch.outputs.opencga_branch }}
          path: opencga-home
          fetch-depth: '10'
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'maven'
      - name: OpenCGA Enterprise Maven Build (skip tests)
        run: |
          if [ -n "${{ inputs.task }}" ]; then
              ./build.sh -b -T "${{ inputs.task }}" --storage-hadoop ${{ inputs.hadoop }} 
          else
              ./build.sh -b --storage-hadoop ${{ inputs.hadoop }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: build-folder
          path: build

  deploy-docker:
    uses: ./.github/workflows/deploy-docker-hub-enterprise-workflow.yml
    needs:  build
    secrets: inherit
    with:
      artifact_name: build-folder