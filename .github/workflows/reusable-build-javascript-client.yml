name: Build opencga javascript-client

on:
  workflow_call:
    inputs:
      branch:
        description: "The branch, tag or SHA of the source code to build client."
        type: string
        required: true

jobs:
  build-javascript-client:
    runs-on: ${{ vars.UBUNTU_VERSION }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: '10'
          ref: ${{ inputs.branch }}
      - id: get_opencga_branch
        name: Get OpenCGA branch from pom.xml property
        run: |
          chmod +x ./.github/workflows/scripts/opencga_branch.sh
          opencga_branch=$(./.github/workflows/scripts/opencga_branch.sh "${{ inputs.release }}" )
          echo "OpenCGA ref: __\"${opencga_branch}\"__" | tee -a ${GITHUB_STEP_SUMMARY}
          echo "Is release: __\"${{ inputs.release }}\"__" | tee -a ${GITHUB_STEP_SUMMARY}
          echo "opencga_branch=${opencga_branch}" >> $GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          repository: opencb/opencga
          ref: ${{ steps.get_opencga_branch.outputs.opencga_branch }}
          path: opencga-home
          fetch-depth: '10'
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'maven'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build R client
        run: |
          ./client-builder.sh --skip-r --skip-python
      - name: Upload built javascript client package as artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencga-enterprise-javascript-client-${{ steps.version.outputs.version }}.tar.gz
          path: build/dist/opencga-enterprise-javascript-client-${{ steps.version.outputs.version }}.tar.gz

