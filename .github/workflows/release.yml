name: Release new opencga-enterprise version

on:
  push:
    tags:
      - '*'
    workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build-java-enterprise-workflow.yml
    with:
      maven_opts: -Dopencga.war.name=opencga

  deploy-docker:
    uses: ./.github/workflows/deploy-docker-hub-enterprise-workflow.yml
    needs: build
    secrets: inherit

  release:
    name: Create GitHub Release
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - uses: actions/download-artifact@v3
        with:
          name: build-folder
      - name: GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref }}
          generate_release_notes: true
          files: |
            opencga-enterprise-client-${{ needs.build.outputs.version }}.tar.gz
