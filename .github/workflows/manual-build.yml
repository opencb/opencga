name: Manual build workflow

on:
  workflow_dispatch:
    inputs:
      storage_hadoop:
        type: string
        required: false
        description: 'Hadoop flavour'
        default: emr6.1

jobs:
  build:
    uses: ./.github/workflows/build-java-enterprise-workflow.yml
    with:
      storage_hadoop: ${{ inputs.storage_hadoop }}
      artifact_name: build-folder

  deploy-docker:
    uses: ./.github/workflows/deploy-docker-hub-enterprise-workflow.yml
    needs: build
    secrets: inherit
    with:
      artifact_name: build-folder

