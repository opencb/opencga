name: Manual build workflow

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "The branch, tag or SHA of the source code to build docker."
        type: string
        required: true
      tag:
        description: "The tag for the new docker."
        type: string
        required: false
      storage_hadoop:
        type: choice
        description: 'Hadoop flavour.'
        required: false
        default: "hdi5.1"
        options:
          - "all"
          - "hbase2.0"
          - "hdi5.1"
          - "emr6.1"
          - "emr6.13"
          - "emr7.5"
      release:
        type: boolean
        required: false
        default: ""
      python_client:
        type: boolean
        required: false
        default: "false"
      r_client:
        type: boolean
        required: false
        default: "false"
      javascript_client:
        type: boolean
        required: false
        default: "false"


jobs:
  build:
    name: Build OpenCGA Enterprise app
    runs-on: ${{ vars.UBUNTU_VERSION }}
    outputs:
      version: ${{ steps.get_project_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '10'
          ref: "${{ inputs.branch }}"
      - id: get_opencga_branch
        name: Get OpenCGA branch from pom.xml property
        run: |
          chmod +x ./.github/workflows/scripts/opencga_branch.sh
          opencga_branch=$(./.github/workflows/scripts/opencga_branch.sh "${{ inputs.release }}" )
          echo "opencga_branch=${opencga_branch}" >> $GITHUB_OUTPUT
          echo "OpenCGA ref: __\"${opencga_branch}\"__" | tee -a ${GITHUB_STEP_SUMMARY}
          echo "Is release: __\"${{ inputs.release }}\"__" | tee -a ${GITHUB_STEP_SUMMARY}         
          echo "Hadoop: __\"${{ inputs.storage_hadoop }}\"__" | tee -a ${GITHUB_STEP_SUMMARY}
          echo "Tag: __\"${{ inputs.tag }}\"__" | tee -a ${GITHUB_STEP_SUMMARY}
      - uses: actions/checkout@v4
        with:
          repository: opencb/opencga
          ref: ${{ steps.get_opencga_branch.outputs.opencga_branch }}
          path: opencga-home
          fetch-depth: '10'
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'maven'
      - name: Clone dependencies
        id: clone_dependencies
        run: |
          if [ -f "./.github/workflows/scripts/get_same_branch.sh" ]; then
            chmod +x ./.github/workflows/scripts/get_same_branch.sh
            export DEPENDENCIES_SHA=${{ github.sha }}
            ./.github/workflows/scripts/get_same_branch.sh ${{ github.ref_name }}
          fi
      - name: Cache local Maven repository
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ inputs.storage_hadoop }}-${{ steps.clone_dependencies.outputs.dependencies_sha }}
          restore-keys: |
            ${{ runner.os }}-maven-${{ inputs.storage_hadoop }}-
      - name: Compile dependencies
        run: |
          if [ -f "./.github/workflows/scripts/compile_same_branch.sh" ]; then
            chmod +x ./.github/workflows/scripts/compile_same_branch.sh
            ./.github/workflows/scripts/compile_same_branch.sh
          fi
      - name: OpenCGA Enterprise Maven Build (skip tests)
        run: |
          CLIENTS=""
          if [ "${{ inputs.python_client }}" == "true" ]; then
            echo "Building Python client"
            CLIENTS="$CLIENTS --python-client"
          fi
          if [ "${{ inputs.r_client }}" == "true" ]; then
            echo "Building R client"
            CLIENTS="$CLIENTS --R-client"
          fi
          if [ "${{ inputs.javascript_client }}" == "true" ]; then
            echo "Building JavaScript client"
            CLIENTS="$CLIENTS --javascript-client"
          fi          
          ./build.sh --storage-hadoop ${{ inputs.storage_hadoop }} $CLIENTS
      - id: get_project_version
        uses: avides/actions-project-version-check@v1.3.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          file-to-check: pom.xml
          only-return-version: true
      - name: Chmod to sh files
        run: "find build -regex '.*sh' | while read file ; do chmod u+x $file ; done"
      - name: Docker Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      - name: Push in Docker Hub
        run: |
          set -e
          chmod +x ./.github/workflows/scripts/opencga_enterprise_docker_tag.sh
          tag=$(./.github/workflows/scripts/opencga_enterprise_docker_tag.sh ${{ inputs.tag }})
          python3 ./build/cloud/docker/docker-build.py push --org zettagenomics --images enterprise --tag "$tag"
