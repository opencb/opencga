---
sso:
  active: true
  casServerPrefixUrl: https://localhost:8443/cas
  serverName: http://localhost:9090
  pythonBin: python3
  protocol: SAML1
  attributes:
    name: name
    surname: surname
    email: email
    organization: organization
    groups: groups
cvdb:
  active: true
  prefix: cvdb
  database:
    hosts:
      - http://localhost:8983/solr/    # URL containing host and port, e.g. http://localhost:8983/solr/
    timeout: 30000
